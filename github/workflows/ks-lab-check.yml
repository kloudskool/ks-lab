name: KloudSkool lab check

# Run from the Actions tab: KloudSkool lab check > Run workflow > choose the lab.
on:
  workflow_dispatch:
    inputs:
      lab:
        description: "Which lab to check"
        required: true
        type: choice
        options: ["12", "13", "final"]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags and all branches
        run: git fetch --tags --force origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Check lab ${{ inputs.lab }}
        run: node .github/ks-lab/check.js "${{ inputs.lab }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KS_ORG: kloudskool
